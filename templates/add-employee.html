<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add-employee</title>
</head>
<body>
    <div class="container">
        <h1>Add Employee</h1>
    <form action="/add-employee" method="POST">
        <div class="row">
            <div class="form-group">
    <label for="name">Employee name:</label>
    <input type="text" id="name" placeholder="Enter Employee name" name="name" required>
    </div>
    <div class="form-group">
    <label for="email">email:</label>
    <input type="email" id="email" placeholder="enter your email" name="email" required>
    </div>
    </div>
    <div class="row">
    <div class="form-group">
    <label for="phone number">phone number:</label>
    <input type="tel" id="phone" placeholder="enter your phone number" name="phone" required>
    </div>
    <div class="form-group">
    <label for="department">department:</label>
    <select id="department" name="department" required>
        <option value="">select department</option>
        <option value="IT">IT</option>
        <option value="Marketing">Marketing</option>
        <option value="HR">HR</option>
        <option value="Sales">sales</option>
        <option value="Finance">Finance</option>
       </div>
    </div>
    <div class="row">
    <div class="form-group">
    <label for="salary">salary:</label>
    <input type="number" id="salary" placeholder="enter your salary" name="salary" required>
    </div>
    <div class="form-group">
    <label for="joining date">joining date:</label>
    <input type="date" id="joining date" placeholder="enter your joining date" name="joining date" required>
    </div>
    </div>
    <div class="row">
    <div class="form-group">
    <label for="address">address:</label>
    <textarea id="address" placeholder="enter your address" name=address required></textarea>
    </div>
    </div>
    <div class="button">
    <button type="submit"class="add-btn">addEmployee</button>
    <button type="submit" class="add-btn">Reset</button>
    </div>
    </form>
</body>
</html>
